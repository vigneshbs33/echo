org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official


# Writing engine defaults, compiled into BuildConfig. Override per machine in
# ~/.gradle/gradle.properties or on the command line: ./gradlew assembleDebug -Pecho.llm.model=gpt-4o
# Any server that speaks the OpenAI Chat Completions protocol works. No API keys here:
# the user enters their own key in the app and it is stored encrypted on the device.
echo.llm.baseUrl=https://api.openai.com/
echo.llm.model=gpt-4o-mini
