name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ktlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install ktlint 1.3.1
        run: |
          curl -sSfL -o ktlint https://github.com/pinterest/ktlint/releases/download/1.3.1/ktlint
          chmod +x ktlint

      - name: Check Kotlin style
        run: ./ktlint --relative "**/*.kt" "**/*.kts"

  build:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        run: ./gradlew :apps:android:assembleDebug --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7
